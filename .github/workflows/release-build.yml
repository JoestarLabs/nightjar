name: "Manual Release Build"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true
        type: string

env:
  APP_NAME: nightjar

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set release version env
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: echo "RELEASE_VERSION=$INPUT_TAG" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        id: sign_apk
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.SIGNING_KEYSTORE }}
          keyStorePassword: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          keyAlias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Rename signed APK
        env:
          SIGNED_FILE: ${{ steps.sign_apk.outputs.signedFile }}
        run: mv "$SIGNED_FILE" "${APP_NAME}-release-${RELEASE_VERSION}.apk"

      - name: Create GitHub Release and upload APK
        uses: "mathieucarbou/marvinpinto-action-automatic-releases@latest"
        with:
          # Built-in GITHUB_TOKEN is sufficient for creating releases in the same repo.
          # No PAT required.
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: ${{ github.event.inputs.tag }}
          prerelease: false
          title: "Nightjar ${{ github.event.inputs.tag }}"
          files: ${{ env.APP_NAME }}-release-${{ env.RELEASE_VERSION }}.apk

      - name: VirusTotal Scan
        id: vt
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            ${{ env.APP_NAME }}-release-${{ env.RELEASE_VERSION }}.apk

      - name: Update Release Body with Scan Results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
          VT_LINK: ${{ steps.vt.outputs.analysis }}
        run: |
          CURRENT_BODY=$(gh release view "$TAG" --json body --jq .body)
          VT_URL=$(echo "$VT_LINK" | cut -d'=' -f2-)
          NEW_BODY=$(printf "%s\n\n## Security Scan\n* [VirusTotal Analysis](%s)\n" "$CURRENT_BODY" "$VT_URL")
          gh release edit "$TAG" --notes "$NEW_BODY"
